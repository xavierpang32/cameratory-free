<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1D21">
<title>Kit Log — Camera Gear Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#1C1D21;
    --surface:#25272E;
    --surface-2:#2E313A;
    --surface-3:#383B45;
    --border:#3A3D47;
    --text:#EDEDF0;
    --text-dim:#9A9CA8;
    --text-faint:#6C6F7A;
    --accent:#6EE7A8;
    --accent-dim:#3A6B52;
    --amber:#F2A65A;
    --amber-dim:#6b5636;
    --red:#E8574A;
    --red-dim:#6b3630;
    --blue:#6FA8E8;
    --blue-dim:#33465e;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
    --font-ui: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono: "SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(1200px 400px at 50% -120px, rgba(110,231,168,0.06), transparent 60%),
      var(--bg);
  }

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 10px;
    background:linear-gradient(var(--bg) 70%, transparent);
    backdrop-filter:blur(6px);
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1.05;}
  .brand-text b{font-size:17px;letter-spacing:0.2px;}
  .brand-text span{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1.6px;font-family:var(--font-mono);}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-dim);
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:active{background:var(--surface-3);}

  .search-row{display:flex; gap:8px; margin-bottom:12px;}
  .search-wrap{position:relative; flex:1; min-width:0;}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-faint);}
  #searchInput{
    width:100%; padding:11px 14px 11px 38px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-m); color:var(--text); font-size:14.5px;
  }
  #searchInput::placeholder{color:var(--text-faint);}
  #searchInput:focus{outline:2px solid var(--accent-dim); border-color:var(--accent);}
  #searchFieldSelect{
    flex-shrink:0; width:92px; padding:0 8px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    color:var(--text-dim); font-size:11.5px; font-family:var(--font-mono);
    text-transform:uppercase; letter-spacing:0.5px; color-scheme:dark;
  }
  #searchFieldSelect:focus{outline:2px solid var(--accent-dim); border-color:var(--accent);}

  .chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:6px 12px; border-radius:100px; font-size:12.5px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    white-space:nowrap;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:#12241a; font-weight:600;}

  .filter-row{display:flex; align-items:center; gap:8px;}
  .filter-row .chip-row{flex:1; min-width:0;}
  #sortSelect{
    flex-shrink:0; padding:6px 11px;
    background:var(--surface); border:1px solid var(--border); border-radius:100px;
    color:var(--text-dim); font-size:11.5px; font-family:var(--font-mono);
    color-scheme:dark;
  }
  #sortSelect:focus{outline:2px solid var(--accent-dim); border-color:var(--accent);}

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:sticky; bottom:0; z-index:20;
    display:flex; gap:6px; justify-content:space-around;
    background:rgba(37,39,46,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    padding:5px 6px calc(env(safe-area-inset-bottom) + 5px);
  }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--text-faint); font-size:10px; letter-spacing:0.3px; font-weight:600; flex:1;
    padding:5px 4px; border-radius:12px;
    background:transparent; border:none; -webkit-appearance:none; appearance:none;
  }
  .tab-btn svg{width:19px;height:19px;}
  .tab-btn.active{background:var(--accent); color:#12241a;}

  main{flex:1; padding:4px 18px 100px; overflow-y:auto;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty svg{width:52px;height:52px;color:var(--surface-3); margin-bottom:14px;}
  .empty h3{color:var(--text-dim); font-size:15px; margin:0 0 6px;}
  .empty p{font-size:13px; margin:0; line-height:1.5;}

  /* ---------- Gear card ---------- */
  .gear-card{
    display:flex; gap:12px; padding:12px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  }
  .gear-thumb{
    width:58px;height:58px;border-radius:var(--radius-s); flex-shrink:0;
    background:var(--surface-2); display:flex;align-items:center;justify-content:center;
    overflow:hidden; color:var(--text-faint); border:1px solid var(--border);
  }
  .gear-thumb img{width:100%;height:100%;object-fit:cover;}
  .gear-thumb svg{width:26px;height:26px;}
  .gear-info{flex:1; min-width:0;}
  .gear-info .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .gear-info h4{margin:0; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gear-meta{font-size:11.5px; color:var(--text-faint); margin-top:2px; font-family:var(--font-mono);}
  .badge-row{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; padding:3px 8px;
    border-radius:100px; font-weight:600; letter-spacing:0.2px;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%; flex-shrink:0;}
  .pill.status-storage{background:var(--blue-dim); color:#b9d6f5;} .pill.status-storage .dot{background:var(--blue);}
  .pill.status-use{background:var(--accent-dim); color:#c7f3da;} .pill.status-use .dot{background:var(--accent);}
  .pill.status-loan{background:var(--amber-dim); color:#f9dcb8;} .pill.status-loan .dot{background:var(--amber);}
  .pill.status-repair{background:var(--red-dim); color:#f9cbc5;} .pill.status-repair .dot{background:var(--red);}
  .pill.status-retired{background:var(--surface-3); color:var(--text-faint);} .pill.status-retired .dot{background:var(--text-faint);}
  .pill.cat{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}

  /* ---------- Section headers ---------- */
  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:1.6px; color:var(--text-faint);
    font-family:var(--font-mono); margin:22px 2px 10px;
  }
  .section-label:first-child{margin-top:8px;}

  /* ---------- Kit card ---------- */
  .kit-card{
    padding:16px; margin-bottom:12px; border-radius:var(--radius-l);
    background:linear-gradient(145deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
  }
  .kit-card .kit-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .kit-card h4{margin:0 0 2px; font-size:16px;}
  .kit-card .kit-sub{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);}
  .kit-ready{font-size:11px; padding:4px 10px; border-radius:100px; font-weight:700; font-family:var(--font-mono); white-space:nowrap;}
  .kit-ready.all{background:var(--accent-dim); color:var(--accent);}
  .kit-ready.some{background:var(--amber-dim); color:var(--amber);}
  .kit-thumbs{display:flex; margin-top:12px;}
  .kit-thumbs .gear-thumb{width:40px;height:40px; margin-left:-10px; border:2px solid var(--surface); border-radius:10px;}
  .kit-thumbs .gear-thumb:first-child{margin-left:0;}
  .kit-more{width:40px;height:40px;border-radius:10px; margin-left:-10px; background:var(--surface-3); border:2px solid var(--surface); display:flex;align-items:center;justify-content:center; font-size:11px; color:var(--text-dim); font-weight:600;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:calc(50% - 280px + 20px); bottom:calc(env(safe-area-inset-bottom) + 78px);
    width:56px;height:56px;border-radius:50%; z-index:25;
    background:var(--accent); color:#12241a;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(110,231,168,0.35);
  }
  @media (max-width:560px){ .fab{ right:20px; } }
  .fab svg{width:24px;height:24px; transition:transform .35s cubic-bezier(.2,.9,.3,1.4);}
  .fab:active svg{transform:rotate(100deg) scale(0.85);}
  @media (prefers-reduced-motion: reduce){ .fab svg{transition:none;} }

  /* ---------- Overview / dashboard ---------- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px;}
  .stat-card .num{font-size:24px; font-weight:700; font-family:var(--font-mono);}
  .stat-card .lbl{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-row .name{width:96px; font-size:12px; color:var(--text-dim); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:5px;}
  .bar-row .count{width:22px; text-align:right; font-size:12px; font-family:var(--font-mono); color:var(--text-faint);}
  .alert-item{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); margin-bottom:8px; font-size:13px;}

  /* ---------- Sheet / modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40;
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--bg); width:100%; max-width:560px; margin:0 auto;
    border-radius:22px 22px 0 0; max-height:92dvh; overflow-y:auto;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.85,.3,1);
    border:1px solid var(--border); border-bottom:none;
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
  }
  .sheet-backdrop.open .sheet{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ .sheet, .sheet-backdrop{transition:none;} }
  .sheet-handle{width:38px;height:4px;background:var(--surface-3); border-radius:3px; margin:10px auto 4px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2;}
  .sheet-head h3{margin:0; font-size:16px;}
  .sheet-body{padding:16px 18px 10px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-bottom:7px; font-family:var(--font-mono);}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
    width:100%; padding:11px 13px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-s); color:var(--text); font-size:14.5px; font-family:var(--font-ui);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent-dim); border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .req::after{content:" *"; color:var(--red);}

  .seg{display:flex; gap:6px; flex-wrap:wrap;}
  .seg button{
    padding:9px 13px; border-radius:100px; font-size:12.5px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  }
  .seg button.active{background:var(--accent); border-color:var(--accent); color:#12241a; font-weight:700;}
  .seg button.status-loan.active{background:var(--amber); color:#3a2708;}
  .seg button.status-repair.active{background:var(--red); color:#3a1108;}
  .seg button.status-retired.active{background:var(--text-faint); color:#1c1d21;}

  /* photo capture */
  .photo-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .photo-thumb{position:relative; width:74px;height:74px;border-radius:var(--radius-s); overflow:hidden; border:1px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb button{
    position:absolute; top:3px; right:3px; width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,0.65); color:#fff; display:flex;align-items:center;justify-content:center;
  }
  .photo-thumb button svg{width:11px;height:11px;}
  .add-photo{
    width:74px;height:74px;border-radius:var(--radius-s); border:1.5px dashed var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--text-faint); font-size:10px; position:relative;
  }
  .add-photo svg{width:20px;height:20px;}
  .add-photo input{position:absolute; inset:0; opacity:0;}

  /* service history — stacked card so it never squeezes on narrow screens */
  .svc-card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:12px; margin-bottom:10px;}
  .svc-card-row{display:flex; gap:8px; align-items:flex-end;}
  .svc-card-row .field{margin-bottom:0; min-width:0;}
  .svc-field-date{flex:1.3; min-width:0;}
  .svc-field-cost{flex:1; min-width:0;}
  .svc-field-desc{margin-top:10px;}
  .svc-desc-input{
    width:100%; padding:11px 13px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-s); color:var(--text); font-size:14.5px; font-family:var(--font-ui);
    resize:none; overflow:hidden; min-height:44px; line-height:1.4;
  }
  .svc-desc-input:focus{outline:2px solid var(--accent-dim); border-color:var(--accent);}
  .svc-card input{min-width:0;}
  .svc-remove{width:38px;height:38px;flex-shrink:0;border-radius:var(--radius-s); background:var(--surface-3); display:flex;align-items:center;justify-content:center; color:var(--text-faint); border:1px solid var(--border);}
  .svc-remove svg{width:14px;height:14px;}
  .svc-empty{color:var(--text-faint); font-size:12.5px; margin:0 0 10px;}

  /* combo gear picker */
  .pick-cat{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); font-family:var(--font-mono); margin:16px 0 8px;}
  .pick-row{display:flex; align-items:center; gap:11px; padding:9px 4px; border-bottom:1px solid var(--border);}
  .pick-row:last-child{border-bottom:none;}
  .checkbox{width:21px;height:21px;border-radius:6px; border:1.5px solid var(--border); background:var(--surface); flex-shrink:0; display:flex;align-items:center;justify-content:center;}
  .checkbox.checked{background:var(--accent); border-color:var(--accent);}
  .checkbox.checked svg{width:13px;height:13px; color:#12241a;}
  .pick-row .gear-thumb{width:38px;height:38px;}
  .pick-info{flex:1; min-width:0;}
  .pick-info .nm{font-size:13.5px; font-weight:600;}
  .pick-info .sub{font-size:11px; color:var(--text-faint);}

  .btn{
    width:100%; padding:13px; border-radius:var(--radius-m); font-size:14.5px; font-weight:700;
    background:var(--accent); color:#12241a; margin-top:6px;
  }
  .btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--red-dim); color:#ffd7d1;}
  .btn:active{filter:brightness(0.93);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{margin-top:0;}

  /* detail view */
  .detail-photos{display:flex; gap:8px; overflow-x:auto; margin:0 -18px 18px; padding:0 18px; scrollbar-width:none;}
  .detail-photos::-webkit-scrollbar{display:none;}
  .detail-photos img{height:180px; width:auto; border-radius:var(--radius-m); flex-shrink:0; border:1px solid var(--border); object-fit:cover;}
  .detail-photos .no-photo{height:180px; width:100%; border-radius:var(--radius-m); background:var(--surface); border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-direction:column; gap:8px;}
  .detail-photos .no-photo svg{width:36px;height:36px;}
  .detail-title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;}
  .detail-title-row h2{margin:0; font-size:20px;}
  .kv{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .kv .k{color:var(--text-faint);}
  .kv .v{font-family:var(--font-mono); text-align:right;}
  .svc-entry{padding:11px 0; border-bottom:1px solid var(--border);}
  .svc-entry .row{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .svc-entry .d{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); flex-shrink:0;}
  .svc-entry .desc{font-size:13.5px; margin-top:3px; color:var(--text); white-space:pre-wrap;}
  .svc-entry .c{font-family:var(--font-mono); font-size:12.5px; color:var(--accent); flex-shrink:0;}
  .notes-block{font-size:13.5px; color:var(--text-dim); line-height:1.6; white-space:pre-wrap;}

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 90px); transform:translateX(-50%) translateY(10px);
    background:var(--surface-3); color:var(--text); padding:10px 18px; border-radius:100px; font-size:13px;
    z-index:60; opacity:0; transition:opacity .25s, transform .25s; border:1px solid var(--border); white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--border);}
  .settings-row .lbl{font-size:14px;}
  .settings-row .sub{font-size:11.5px; color:var(--text-faint); margin-top:2px;}

  /* ---------- About page ---------- */
  .about-hero{text-align:center; padding:28px 10px 20px;}
  .about-hero svg{width:48px;height:48px;}
  .about-hero h2{margin:14px 0 2px; font-size:19px;}
  .about-hero .tagline{color:var(--text-faint); font-size:12.5px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1.4px;}
  .about-hero .version{margin-top:10px; display:inline-block; font-size:11px; font-family:var(--font-mono); color:var(--text-dim); background:var(--surface); border:1px solid var(--border); padding:3px 10px; border-radius:100px;}
  .about-desc{font-size:13.5px; color:var(--text-dim); line-height:1.7; text-align:center; padding:0 6px 8px;}
  .about-credits{text-align:center; padding:6px 6px 24px;}
  .about-link{color:var(--accent); font-size:13.5px; font-weight:600; word-break:break-all; text-decoration:none;}
  .about-link:active{opacity:0.75;}
  .about-copyright{margin-top:10px; font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:0.4px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10.5" stroke="var(--accent)" stroke-width="1.6"/><circle cx="12" cy="12" r="5.2" stroke="var(--accent)" stroke-width="1.6"/><circle cx="12" cy="12" r="1.6" fill="var(--accent)"/></svg>
        <div class="brand-text"><b>Kit Log</b><span>Gear Inventory</span></div>
      </div>

/* ============ tiny IndexedDB wrapper ============ */
var DB_NAME = "kitlog_db", DB_VERSION = 2;
var _db = null;
function openDB(){
  return new Promise(function(resolve, reject){
    if(_db){ resolve(_db); return; }
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains("gear")) db.createObjectStore("gear", {keyPath:"id"});
      if(!db.objectStoreNames.contains("kits")) db.createObjectStore("kits", {keyPath:"id"});
      if(!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", {keyPath:"key"});
    };
    req.onsuccess = function(e){ _db = e.target.result; resolve(_db); };
    req.onerror = function(e){ reject(e); };
  });
}
function txStore(name, mode){
  return openDB().then(function(db){
    return db.transaction(name, mode || "readonly").objectStore(name);
  });
}
function dbGetAll(store){
  return txStore(store).then(function(s){
    return new Promise(function(res, rej){
      var r = s.getAll();
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(e){ rej(e); };
    });
  });
}
function dbGet(store, key){
  return txStore(store).then(function(s){
    return new Promise(function(res, rej){
      var r = s.get(key);
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(e){ rej(e); };
    });
  });
}
function dbPut(store, obj){
  return txStore(store, "readwrite").then(function(s){
    return new Promise(function(res, rej){
      var r = s.put(obj);
      r.onsuccess = function(){ res(obj); };
      r.onerror = function(e){ rej(e); };
    });
  });
}
function dbDelete(store, id){
  return txStore(store, "readwrite").then(function(s){
    return new Promise(function(res, rej){
      var r = s.delete(id);
      r.onsuccess = function(){ res(); };
      r.onerror = function(e){ rej(e); };
    });
  });
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}
function escapeHtml(s){
  return (s===undefined||s===null? "": String(s)).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtMoney(n){
  if(n===undefined||n===null||n==="") return "—";
  var num = parseFloat(n);
  if(isNaN(num)) return "—";
  return "$" + num.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return "—";
  try{
    var dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"});
  }catch(e){ return d; }
}
function statusCls(status){
  var m = STATUSES.find(function(s){ return s.v === status; });
  return m ? m.cls : "status-storage";
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}

/* ============ image compression ============ */
function fileToCompressedDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 1000;
        var w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Fuzzy match: exact substrings rank best (by position), otherwise falls back to
   in-order subsequence matching (e.g. "cnr5" matches "Canon EOS R5") so short,
   imprecise queries still surface the right gear. Returns {matched, score} —
   lower score is a better match. */
function fuzzyMatch(query, text){
  if(!query) return {matched:true, score:0};
  var idx = text.indexOf(query);
  if(idx !== -1) return {matched:true, score:idx};
  var qi = 0, score = 1000, lastIdx = -1;
  for(var i=0; i<text.length && qi<query.length; i++){
    if(text[i] === query[qi]){
      if(lastIdx !== -1) score += (i - lastIdx - 1);
      lastIdx = i;
      qi++;
    }
  }
  if(qi === query.length) return {matched:true, score:score};
  return {matched:false, score:Infinity};
}

function sortGearList(list){
  var sorted = list.slice();
  if(state.sortBy === "nameAsc"){
    sorted.sort(function(a,b){ return a.name.localeCompare(b.name); });
  } else if(state.sortBy === "nameDesc"){
    sorted.sort(function(a,b){ return b.name.localeCompare(a.name); });
  } else if(state.sortBy === "createdAsc"){
    sorted.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
  } else { // "createdDesc" default
    sorted.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  }
  return sorted;
}

function filteredGear(){
  var q = state.search.trim().toLowerCase();
  var inCategory = state.gear.filter(function(g){
    return state.categoryFilter === "All" || g.category === state.categoryFilter;
  });
  if(!q) return sortGearList(inCategory);
  var matched = inCategory.filter(function(g){
    var hay = String(g[state.searchField] || "").toLowerCase();
    return fuzzyMatch(q, hay).matched;
  });
  return sortGearList(matched);
}

/* ============ Kits tab ============ */
function kitReadiness(kit){
  var items = (kit.gearIds||[]).map(getGear).filter(Boolean);
  var unavailable = items.filter(function(g){ return g.status === "On Loan" || g.status === "In Repair" || g.status === "Retired / Sold"; });
  return {total: items.length, unavailable: unavailable.length, items: items};
}

function renderKits(){
  if(state.kits.length === 0){
    return '<div class="empty">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 8.5l8-4 8 4-8 4-8-4z"/><path d="M4 8.5v7l8 4 8-4v-7"/></svg>'+
      '<h3>'+t("emptyNoKitsTitle")+'</h3><p>'+t("emptyNoKitsBody")+'</p></div>';
  }
  return state.kits.map(function(k){
    var r = kitReadiness(k);
    var readyCls = r.unavailable === 0 ? "all" : "some";
    var readyLabel = r.unavailable === 0 ? t("readyWord") : (r.total - r.unavailable)+"/"+r.total+" "+t("readyWord");
    var thumbs = r.items.slice(0,5).map(function(g){ return gearThumbHTML(g); }).join("");
    var extra = r.items.length > 5 ? '<div class="kit-more">+'+(r.items.length-5)+'</div>' : "";
    return '<div class="kit-card" data-id="'+k.id+'">'+
      '<div class="kit-top"><div><h4>'+escapeHtml(k.name)+'</h4><div class="kit-sub">'+(k.eventType? escapeHtml(k.eventType)+" · ": "")+tItemsCount(r.total)+'</div></div>'+
      '<span class="kit-ready '+readyCls+'">'+readyLabel+'</span></div>'+
      (r.total>0 ? '<div class="kit-thumbs">'+thumbs+extra+'</div>' : '')+
    '</div>';
  }).join("");
}

/* ============ Overview tab ============ */
function renderOverview(){
  var totalItems = state.gear.length;
  var totalValue = state.gear.reduce(function(sum,g){ var p=parseFloat(g.purchasePrice); return sum + (isNaN(p)?0:p); }, 0);
  var byCategory = {};
  CATEGORIES.forEach(function(c){ byCategory[c] = 0; });
  state.gear.forEach(function(g){ byCategory[g.category] = (byCategory[g.category]||0) + 1; });
  var maxCat = Math.max.apply(null, Object.values(byCategory).concat([1]));
  var attention = state.gear.filter(function(g){ return g.status === "On Loan" || g.status === "In Repair"; });

  var html = '';
  html += '<div class="section-label">'+t("snapshot")+'</div>';
  html += '<div class="stat-grid">'+
    '<div class="stat-card"><div class="num">'+totalItems+'</div><div class="lbl">'+t("totalItems")+'</div></div>'+
    '<div class="stat-card"><div class="num">'+fmtMoney(totalValue)+'</div><div class="lbl">'+t("estValue")+'</div></div>'+
    '<div class="stat-card"><div class="num">'+state.kits.length+'</div><div class="lbl">'+t("kitsBuilt")+'</div></div>'+
    '<div class="stat-card"><div class="num">'+attention.length+'</div><div class="lbl">'+t("needAttention")+'</div></div>'+
  '</div>';

  html += '<div class="section-label">'+t("byCategory")+'</div>';
  CATEGORIES.forEach(function(c){
    var n = byCategory[c]||0;
    if(n===0) return;
    html += '<div class="bar-row"><div class="name">'+escapeHtml(tCat(c))+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(n/maxCat*100)+'%"></div></div><div class="count">'+n+'</div></div>';
  });
  if(totalItems===0) html += '<p style="color:var(--text-faint);font-size:13px;">'+t("addGearToSeeBreakdown")+'</p>';

  html += '<div class="section-label">'+t("needsAttentionHeader")+'</div>';
  if(attention.length===0){
    html += '<p style="color:var(--text-faint);font-size:13px;">'+t("nothingOnLoanRepair")+'</p>';
  } else {
    attention.forEach(function(g){
      var st = STATUSES.find(function(s){ return s.v === g.status; });
      html += '<div class="alert-item" data-id="'+g.id+'" data-open-gear="1"><span>'+escapeHtml(g.name)+'</span><span class="pill '+st.cls+'"><span class="dot"></span>'+escapeHtml(tStat(g.status))+'</span></div>';
    });
  }

  return html;
}

/* ============ sheet (modal) plumbing ============ */
var backdrop = document.getElementById("sheetBackdrop");
var sheetEl = document.getElementById("sheet");
var sheetVersion = 0;
function openSheet(innerHTML){
  sheetVersion++;
  sheetEl.innerHTML = innerHTML;
  backdrop.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  var myVersion = sheetVersion;
  backdrop.classList.remove("open");
  document.body.style.overflow = "";
  setTimeout(function(){
    if(sheetVersion === myVersion){ sheetEl.innerHTML = ""; }
  }, 300);
}
backdrop.addEventListener("click", function(e){
  if(e.target === backdrop) closeSheet();
});

function renderPhotoStrip(){

  }).join("");
  html += '<div class="add-photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 015.5 7h1.6l1-1.6A1.5 1.5 0 019.4 4.6h5.2a1.5 1.5 0 011.3.8l1 1.6h1.6A1.5 1.5 0 0120 8.5v9A1.5 1.5 0 0118.5 19h-13A1.5 1.5 0 014 17.5v-9z"/><circle cx="12" cy="12.5" r="3.4"/></svg><span>'+t("photoAdd")+'</span><input type="file" accept="image/*" capture="environment" id="photoInput"></div>';
  wrap.innerHTML = html;
  wrap.querySelectorAll(".removePhoto").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.formPhotos.splice(parseInt(btn.dataset.idx,10),1);
      renderPhotoStrip();
    });
  });

  if(input){

        state.formPhotos.push(dataUrl);
        renderPhotoStrip();
      }).catch(function(){ toast(t("toastCouldntReadPhoto")); });

}

          '<button type="button" class="svc-remove" data-idx="'+idx+'" aria-label="Remove service record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
        '</div>'+
        '<div class="field svc-field-desc"><label>'+t("svcWhatWasDone")+'</label><textarea class="svc-desc-input" rows="1" placeholder="'+escapeHtml(t("svcDescPlaceholder"))+'" data-idx="'+idx+'" data-f="description">'+escapeHtml(s.description)+'</textarea></div>'+
      '</div>';
    }).join("");
  }
  wrap.querySelectorAll("input").forEach(function(inp){
    inp.addEventListener("input", function(){
      state.formServices[parseInt(inp.dataset.idx,10)][inp.dataset.f] = inp.value;
    });
  });
  wrap.querySelectorAll(".svc-desc-input").forEach(function(ta){
    autoGrowTextarea(ta);
    ta.addEventListener("input", function(){
      state.formServices[parseInt(ta.dataset.idx,10)][ta.dataset.f] = ta.value;
      autoGrowTextarea(ta);
    });
  });
  wrap.querySelectorAll(".svc-remove").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.formServices.splice(parseInt(btn.dataset.idx,10),1);
      renderServiceRows();
    });
  });
}

function autoGrowTextarea(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

function saveGearForm(existing){
  var name = document.getElementById("f_name").value.trim();
  if(!name){ toast(t("toastGearNeedsName")); return; }
  var activeStatusBtn = document.getElementById("statusSeg").querySelector("button.active");
  var now = Date.now();
  var obj = {
    id: existing ? existing.id : uid(),
    name: name,
    category: document.getElementById("f_category").value,
    serialNumber: document.getElementById("f_serial").value.trim(),
    condition: document.getElementById("f_condition").value,
    status: activeStatusBtn ? activeStatusBtn.dataset.status : "In Storage",
    loanedTo: document.getElementById("f_loanedTo").value.trim(),
    location: document.getElementById("f_location").value.trim(),
    purchaseDate: document.getElementById("f_purchaseDate").value,
    purchasePrice: document.getElementById("f_purchasePrice").value,
    notes: document.getElementById("f_notes").value.trim(),
    photos: state.formPhotos.slice(),
    serviceHistory: state.formServices.filter(function(s){ return s.date || s.description || s.cost; }),
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now
  };
  dbPut("gear", obj).then(function(){
    return loadAll();
  }).then(function(){
    closeSheet();
    render();
    toast(existing ? t("toastGearUpdated") : t("toastGearAdded"));
  });
}

function confirmDeleteGear(id){
  var g = getGear(id);
  if(!confirm(tf("confirmDeleteGear", {name:g.name}))) return;
  dbDelete("gear", id).then(function(){
    // also remove from any kits
    var affected = state.kits.filter(function(k){ return (k.gearIds||[]).indexOf(id) !== -1; });
    return Promise.all(affected.map(function(k){
      k.gearIds = k.gearIds.filter(function(gid){ return gid !== id; });
      return dbPut("kits", k);
    }));
  }).then(loadAll).then(function(){
    closeSheet();
    render();
    toast(t("toastGearDeleted"));
  });
}

/* ============ Gear detail ============ */
function openGearDetail(id){
  var g = getGear(id);
  if(!g) return;
  var st = STATUSES.find(function(s){ return s.v === g.status; }) || STATUSES[0];
  var photosHtml = (g.photos && g.photos.length)
    ? '<div class="detail-photos">'+g.photos.map(function(p){ return '<img src="'+p+'">'; }).join("")+'</div>'
    : '<div class="detail-photos"><div class="no-photo">'+(ICONS[g.category]||ICON_FALLBACK)+'<span>No photos yet</span></div></div>';

  var svcHtml = (g.serviceHistory && g.serviceHistory.length)
    ? g.serviceHistory.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); }).map(function(s){
        return '<div class="svc-entry"><div class="row"><span class="d">'+fmtDate(s.date)+'</span><span class="c">'+fmtMoney(s.cost)+'</span></div><div class="desc">'+escapeHtml(s.description||"—")+'</div></div>';
      }).join("")
    : '<p style="color:var(--text-faint);font-size:13px;">'+t("noServiceHistory")+'</p>';

  var html = ''+
  '<div class="sheet-handle"></div>'+
  '<div class="sheet-head"><h3>'+t("gearDetailsTitle")+'</h3>'+
    '<div style="display:flex;gap:8px;">'+
    '<button class="icon-btn" id="editGearBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>'+
    '<button class="icon-btn" id="closeGearDetail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>'+
  '</div>'+
  '<div class="sheet-body">'+
    photosHtml+
    '<div class="detail-title-row" style="margin-bottom:16px;"><h2>'+escapeHtml(g.name)+'</h2><span class="pill '+st.cls+'"><span class="dot"></span>'+escapeHtml(tStat(g.status))+'</span></div>'+
    (g.status==="On Loan" && g.loanedTo ? '<div class="kv"><span class="k">'+t("fieldLoanedTo")+'</span><span class="v">'+escapeHtml(g.loanedTo)+'</span></div>' : '')+
    '<div class="kv"><span class="k">'+t("fieldCategory")+'</span><span class="v">'+escapeHtml(tCat(g.category))+'</span></div>'+
    '<div class="kv"><span class="k">'+t("fieldSerial")+'</span><span class="v">'+escapeHtml(g.serialNumber||"—")+'</span></div>'+
    '<div class="kv"><span class="k">'+t("fieldCondition")+'</span><span class="v">'+escapeHtml(g.condition ? tCond(g.condition) : "—")+'</span></div>'+
    '<div class="kv"><span class="k">'+t("kvLocation")+'</span><span class="v">'+escapeHtml(g.location||"—")+'</span></div>'+
    '<div class="kv"><span class="k">'+t("kvPurchased")+'</span><span class="v">'+fmtDate(g.purchaseDate)+'</span></div>'+
    '<div class="kv"><span class="k">'+t("fieldPurchasePrice")+'</span><span class="v">'+fmtMoney(g.purchasePrice)+'</span></div>'+
    '<div class="section-label">'+t("serviceHistory")+'</div>'+
    svcHtml+
    (g.notes ? '<div class="section-label">'+t("fieldNotes")+'</div><div class="notes-block">'+escapeHtml(g.notes)+'</div>' : '')+
  '</div>';

  openSheet(html);
  document.getElementById("closeGearDetail").addEventListener("click", closeSheet);
  document.getElementById("editGearBtn").addEventListener("click", function(){ openGearForm(g.id); });
}

/* ============ Kit form ============ */
function openKitForm(id){
  var kit = id ? getKit(id) : null;
  state.editingKitId = id || null;
  state.pickedGearIds = kit ? (kit.gearIds||[]).slice() : [];

  var html = ''+
  '<div class="sheet-handle"></div>'+
  '<div class="sheet-head"><h3>'+(kit? t("kitFormEditTitle") : t("kitFormNewTitle"))+'</h3>'+
    '<button class="icon-btn" id="closeKitForm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
  '</div>'+
  '<div class="sheet-body">'+
  '<div class="field"><label class="req">'+t("fieldKitName")+'</label><input type="text" id="k_name" placeholder="'+escapeHtml(t("kitNamePlaceholder"))+'" value="'+escapeHtml(kit?kit.name:"")+'"></div>'+
  '<div class="field"><label>'+t("fieldEventType")+'</label><input type="text" id="k_event" placeholder="'+escapeHtml(t("eventTypePlaceholder"))+'" value="'+escapeHtml(kit?kit.eventType||"":"")+'"></div>'+
  '<label style="display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin:18px 0 4px; font-family:var(--font-mono);">'+t("selectGear")+' <span id="pickCount" style="color:var(--accent)"></span></label>'+
  '<div class="search-wrap" style="margin-top:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="kitPickSearch" type="text" placeholder="'+escapeHtml(t("filterGearPlaceholder"))+'"></div>'+
  '<div id="pickList"></div>'+
  '<div class="field" style="margin-top:16px"><label>'+t("fieldNotes")+'</label><textarea id="k_notes" placeholder="'+escapeHtml(t("kitNotesPlaceholder"))+'">'+escapeHtml(kit?kit.notes||"":"")+'</textarea></div>'+
  '<div class="btn-row">'+
    (kit? '<button class="btn danger" id="deleteKitBtn" style="flex:0 0 auto; width:auto; padding:13px 18px;"><svg style="width:16px;height:16px;vertical-align:-3px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>' : '')+
    '<button class="btn" id="saveKitBtn">'+t("saveKit")+'</button>'+
  '</div>'+
  '</div>';

  openSheet(html);
  document.getElementById("closeKitForm").addEventListener("click", closeSheet);
  renderPickList("");
  document.getElementById("kitPickSearch").addEventListener("input", function(e){ renderPickList(e.target.value); });
  document.getElementById("saveKitBtn").addEventListener("click", function(){ saveKitForm(kit); });
  if(kit){
    document.getElementById("deleteKitBtn").addEventListener("click", function(){ confirmDeleteKit(kit.id); });
  }
}

function renderPickList(filterText){
  var wrap = document.getElementById("pickList");
  var countEl = document.getElementById("pickCount");
  if(countEl) countEl.textContent = state.pickedGearIds.length ? tf("selectedCount", {n:state.pickedGearIds.length}) : "";
  var q = (filterText||"").trim().toLowerCase();
  var grouped = {};
  CATEGORIES.forEach(function(c){ grouped[c] = []; });
  state.gear.forEach(function(g){
    if(q){
      var hay = g.name.toLowerCase();
      if(!fuzzyMatch(q, hay).matched) return;
    }
    (grouped[g.category] = grouped[g.category]||[]).push(g);
  });
  var html = "";
  CATEGORIES.forEach(function(c){
    var items = grouped[c];
    if(!items || items.length===0) return;
    html += '<div class="pick-cat">'+escapeHtml(tCat(c))+'</div>';
    items.forEach(function(g){
      var checked = state.pickedGearIds.indexOf(g.id) !== -1;
      html += '<div class="pick-row" data-id="'+g.id+'">'+
        '<div class="checkbox'+(checked?' checked':'')+'">'+(checked?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':'')+'</div>'+
        gearThumbHTML(g)+
        '<div class="pick-info"><div class="nm">'+escapeHtml(g.name)+'</div><div class="sub">'+escapeHtml(tStat(g.status))+'</div></div>'+
      '</div>';
    });
  });
  if(!html) html = '<p style="color:var(--text-faint);font-size:13px;padding:10px 0;">'+(state.gear.length? t("noGearMatches"):t("addGearFirst"))+'</p>';
  wrap.innerHTML = html;
  wrap.querySelectorAll(".pick-row").forEach(function(row){
    row.addEventListener("click", function(){
      var id = row.dataset.id;
      var idx = state.pickedGearIds.indexOf(id);
      if(idx===-1) state.pickedGearIds.push(id); else state.pickedGearIds.splice(idx,1);
      renderPickList(document.getElementById("kitPickSearch").value);
    });
  });
}

function saveKitForm(existing){
  var name = document.getElementById("k_name").value.trim();
  if(!name){ toast(t("toastKitNeedsName")); return; }
  var now = Date.now();
  var obj = {
    id: existing? existing.id : uid(),
    name: name,
    eventType: document.getElementById("k_event").value.trim(),
    notes: document.getElementById("k_notes").value.trim(),
    gearIds: state.pickedGearIds.slice(),
    createdAt: existing? existing.createdAt : now,
    updatedAt: now
  };
  dbPut("kits", obj).then(loadAll).then(function(){
    closeSheet();
    render();
    toast(existing? t("toastKitUpdated") : t("toastKitCreated"));
  });
}

function confirmDeleteKit(id){
  var k = getKit(id);
  if(!confirm(tf("confirmDeleteKit", {name:k.name}))) return;
  dbDelete("kits", id).then(loadAll).then(function(){
    closeSheet();
    render();
    toast(t("toastKitDeleted"));
  });
}

/* ============ Kit detail ============ */
function openKitDetail(id){
  var k = getKit(id);
  if(!k) return;
  var r = kitReadiness(k);
  var readyCls = r.unavailable===0 ? "all":"some";
  var readyLabel = r.unavailable===0 ? t("allReadyWord") : (r.total-r.unavailable)+"/"+r.total+" "+t("readyWord");

  var itemsHtml = r.items.length ? r.items.map(function(g){
    var st = STATUSES.find(function(s){ return s.v===g.status; })||STATUSES[0];
    return '<div class="gear-card" data-id="'+g.id+'">'+gearThumbHTML(g)+
      '<div class="gear-info"><div class="row1"><h4>'+escapeHtml(g.name)+'</h4></div>'+
      '<div class="gear-meta">'+escapeHtml(tCat(g.category))+'</div>'+
      '<div class="badge-row"><span class="pill '+st.cls+'"><span class="dot"></span>'+escapeHtml(tStat(g.status))+'</span></div></div></div>';
  }).join("") : '<p style="color:var(--text-faint);font-size:13px;">'+t("noGearInKit")+'</p>';

  var html = ''+
  '<div class="sheet-handle"></div>'+
  '<div class="sheet-head"><h3>'+t("kitDetailsTitle")+'</h3>'+
    '<div style="display:flex;gap:8px;">'+
    '<button class="icon-btn" id="editKitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>'+
    '<button class="icon-btn" id="closeKitDetail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>'+
  '</div>'+
  '<div class="sheet-body">'+
    '<div class="detail-title-row"><h2>'+escapeHtml(k.name)+'</h2><span class="kit-ready '+readyCls+'">'+readyLabel+'</span></div>'+
    (k.eventType? '<div class="gear-meta" style="margin-bottom:14px;">'+escapeHtml(k.eventType)+'</div>' : '')+
    (k.notes? '<div class="notes-block" style="margin-bottom:16px;">'+escapeHtml(k.notes)+'</div>' : '')+
    '<div class="section-label" style="margin-top:6px;">'+t("gearInThisKit")+'</div>'+
    itemsHtml+
  '</div>';

  openSheet(html);
  document.getElementById("closeKitDetail").addEventListener("click", closeSheet);
  document.getElementById("editKitBtn").addEventListener("click", function(){ openKitForm(k.id); });
  sheetEl.querySelectorAll(".gear-card").forEach(function(card){
    card.addEventListener("click", function(){ openGearDetail(card.dataset.id); });
  });
}

/* ============ Settings sheet (language, export/import) ============ */
function setLanguage(code){
  if(state.language === code) return;
  state.language = code;
  dbPut("settings", {key:"language", value:code});
  applyStaticTranslations();
  renderCategoryChips();
  render();
  openSettingsSheet();
}

function openSettingsSheet(){
  var langButtons = LANGUAGES.map(function(l){
    return '<button type="button" class="'+(state.language===l.code?'active':'')+'" data-lang="'+l.code+'">'+l.label+'</button>';
  }).join('');

  var html = ''+
  '<div class="sheet-handle"></div>'+
  '<div class="sheet-head"><h3>'+t("settingsTitle")+'</h3>'+
    '<button class="icon-btn" id="closeSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
  '</div>'+
  '<div class="sheet-body">'+
    '<div class="field"><label>'+t("languageLabel")+'</label><div class="seg" id="langSeg">'+langButtons+'</div></div>'+
    '<div class="settings-row"><div><div class="lbl">'+t("totalGear")+'</div><div class="sub">'+state.gear.length+' '+t("itemsLoggedSuffix")+'</div></div></div>'+
    '<div class="settings-row"><div><div class="lbl">'+t("totalKits")+'</div><div class="sub">'+state.kits.length+' '+t("combosBuiltSuffix")+'</div></div></div>'+
    '<div class="field" style="margin-top:20px;">'+
      '<button class="btn secondary" id="exportBtn">'+t("exportBackup")+'</button>'+
    '</div>'+
    '<div class="field">'+
      '<label style="position:relative; display:block;">'+
        '<button class="btn secondary" type="button" id="importBtnLabel">'+t("importBackup")+'</button>'+
        '<input type="file" accept="application/json" id="importInput" style="position:absolute; inset:0; opacity:0;">'+
      '</label>'+
    '</div>'+
    '<p style="color:var(--text-faint); font-size:12px; line-height:1.6; margin-top:8px;">'+t("privacyNote")+'</p>'+
  '</div>';
  openSheet(html);
  document.getElementById("closeSettings").addEventListener("click", closeSheet);
  document.getElementById("exportBtn").addEventListener("click", exportBackup);
  document.getElementById("importInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    importBackup(file);
  });
  document.getElementById("langSeg").querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){ setLanguage(btn.dataset.lang); });
  });
}

function exportBackup(){
  var payload = {
    exportedAt: new Date().toISOString(),
    app: "kitlog",
    version: 1,
    gear: state.gear,
    kits: state.kits
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "kitlog-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast(t("toastBackupDownloaded"));
}

function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(e){
    var data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast(t("toastInvalidJson")); return; }
    if(!data || !Array.isArray(data.gear) || !Array.isArray(data.kits)){
      toast(t("toastNotKitLogBackup"));
      return;
    }
    if(!confirm(tf("confirmImport", {g:data.gear.length, k:data.kits.length}))) return;
    Promise.all(data.gear.map(function(g){ return dbPut("gear", g); })
      .concat(data.kits.map(function(k){ return dbPut("kits", k); })))
      .then(loadAll).then(function(){
        closeSheet();
        render();
        toast(t("toastBackupImported"));
      });
  };
  reader.readAsText(file);
}

/* ============ init ============ */
Promise.all([loadAll(), loadSettings()]).then(function(){
  applyStaticTranslations();
  renderCategoryChips();
  render();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){ /* offline support unavailable, app still works */ });
  });
}

})();
